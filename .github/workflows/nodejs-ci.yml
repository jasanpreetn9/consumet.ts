name: Node.js CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Type-checks src/ including tests (the build config excludes them).
      - run: npx tsc --noEmit -p tsconfig.json

      - run: yarn build

      # Replays recorded fixtures, so this doesn't depend on the live sites.
      - run: yarn test
